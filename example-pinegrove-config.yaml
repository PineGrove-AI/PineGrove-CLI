models:
  - name: llama3
    model: meta-llama/Llama-3-8B-Instruct
    port: 8000
    args:
      tensor-parallel-size: 1
      max-model-len: 8192

  - name: mistral
    model: mistralai/Mistral-7B-Instruct
    port: 8001
    args:
      max-model-len: 4096

  # `gpus:` selects which GPUs a model gets. Omit it (or `true`) for all of
  # them; use a docker device spec to pin a model to one card on a multi-GPU
  # box, or `false` for a CPU-only workload.
  - name: embeddings
    model: BAAI/bge-large-en-v1.5
    port: 8002
    gpus: "device=1"
    args:
      max-model-len: 512
