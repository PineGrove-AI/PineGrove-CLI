name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: |
          dotnet publish src/Pinegrove.Cli/Pinegrove.Cli.csproj \
            -c Release -r linux-x64 \
            --self-contained true \
            /p:PublishSingleFile=true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="build-${SHORT_SHA}"
          BINARY="src/Pinegrove.Cli/bin/Release/net10.0/linux-x64/publish/pinegrove-cli"

          gh release create "${TAG}" "${BINARY}" \
            --target "${GITHUB_SHA}" \
            --title "Build ${SHORT_SHA}"
